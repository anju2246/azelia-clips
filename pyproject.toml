[project]
name = "azelia-clips"
version = "0.1.0"
description = "AI-powered podcast clip generator — part of the Azelia suite by Inminente"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Inminente Podcast" },
]
keywords = ["podcast", "clips", "ai", "video", "short-form", "viral", "reels", "tiktok", "azelia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "groq>=0.4.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ffmpeg-python>=0.2.0",
    "imageio-ffmpeg>=0.5.1",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "anthropic[vertex]>=0.40.0",
    "google-genai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "sqlmodel>=0.0.8",
    "PyJWT>=2.8.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "isodate>=0.6.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
youtube = [
    "youtube-transcript-api>=0.6.0",
]
asr = [
    "whisperx @ git+https://github.com/m-bain/whisperX.git",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
asr-mlx = [
    "mlx-whisper>=0.4.0",
]
vision = [
    "facenet-pytorch>=2.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pyannote.audio>=3.1.0",
]
all = [
    "azelia-clips[asr,asr-mlx,vision,youtube]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://azelia.ai"
Documentation = "https://azelia.ai/clips"
Repository = "https://github.com/anju2246/azelia-clips"
Issues = "https://github.com/anju2246/azelia-clips/issues"

[project.scripts]
azelia = "packages.clips.cli:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
